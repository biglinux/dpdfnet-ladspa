[package]
name = "dpdfnet-ladspa"
version = "0.2.0"
edition = "2021"
authors = ["BigLinux"]
license = "MIT"
description = "DPDFNet Speech Enhancement LADSPA plugin (OpenVINO Runtime, one model per .so)"
rust-version = "1.85"
build = "build.rs"

# The output cdylib name is derived from the build-time `DPDFNET_MODEL`
# env var by build.rs and renamed at install time by the PKGBUILD; the
# `[lib]` block stays generic so `cargo build` works for any model.
[lib]
name = "dpdfnet_ladspa"
# `rlib` alongside the plugin so integration tests can drive the real
# `run()` callback. It does not change the shipped `.so`.
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
ladspa = "0.3"
# OpenVINO 2026.x is the system runtime on BigLinux (provided by the
# `openvino` package). `runtime-linking` makes the bindings `dlopen` it on
# first use instead of recording a versioned `DT_NEEDED`. Linking at build
# time pinned the soname of the day — an `openvino` update then bumped it
# and every DPDFNet plugin stopped loading (2610 → 2620 → 2630), which the
# host saw as a missing plugin and a crash-looping mic unit.
openvino = { version = "0.10", features = ["runtime-linking"] }
realfft = "3.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
unused_mut = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
not_unsafe_ptr_arg_deref = "deny"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"

[patch.crates-io]
ladspa = { path = "vendor/ladspa-patched" }
